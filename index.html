<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kedar Industries | Website coming soon</title>
  <meta name="description" content="Kedar Industries, Nashik: manufacturer of electrical control panels and capacitor parts. Our new website is launching soon." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #141414;
      --muted: #5c5c5c;
      --paper: #f7f6f2;
      --amber: #f5b400;
      --line: #e3dfd3;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      border-top: 6px solid var(--amber);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 20px;
    }
    .logo { width: min(340px, 78vw); height: auto; }
    .tag {
      margin: 40px 0 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a77a00;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.15;
      font-weight: 700;
      max-width: 16ch;
    }
    p.lead {
      margin: 16px 0 0;
      max-width: 46ch;
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
    }
    .contact {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }
    .contact a.primary { background: var(--amber); border-color: var(--amber); font-weight: 700; }
    .contact a:hover { border-color: var(--ink); }
    .contact a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    footer {
      padding: 20px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo-wordmark.svg" alt="Kedar Industries" width="340" height="104" />
    <p class="tag">Website coming soon</p>
    <h1>Our new website is on its way.</h1>
    <p class="lead">
      Kedar Industries manufactures electrical control panels and capacitor parts in Nashik.
      For enquiries in the meantime, write or call us.
    </p>
    <div class="contact">
      <a class="primary" href="mailto:info@kedarindustries.net">info@kedarindustries.net</a>
      <a href="tel:+919657519210">+91 96575 19210</a>
    </div>
  </main>
  <footer>Plot No. M-20, Siemens Road, MIDC Ambad, Nashik 422010, Maharashtra</footer>
</body>
</html>
